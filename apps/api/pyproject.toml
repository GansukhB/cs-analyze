[project]
name = "cs-analyze-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "awpy>=2.0.2",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "playwright>=1.63.0",
    "polars>=1.44.2",
    "psutil>=7.2.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make the package look first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
